tool: exa
name: Exa
env:
- EXA_API_KEY
setups:
  exa:
    class: main
    endpoint: POST https://api.exa.ai/search
    settings:
      type: deep-reasoning
      output_schema: funding
    pricing:
      usd: 0.015
      unit: request
      source: https://exa.ai/pricing?tab=api
      note: Cost each response reported.
  exa-agent:
    class: main
    endpoint: POST https://api.exa.ai/agent/runs
    settings:
      effort: medium
      output_schema: funding
    pricing:
      usd: 0.1
      unit: request
      source: https://exa.ai/pricing?tab=api
      note: Flat rate at effort=medium. The API default, effort=auto, is metered up to $5 per run.
  exa-instant:
    class: main
    endpoint: POST https://api.exa.ai/search
    settings:
      type: instant
      output_schema: funding
    pricing:
      usd: 0.007
      unit: request
      source: https://exa.ai/pricing?tab=api
      note: Cost each response reported.
