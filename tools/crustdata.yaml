tool: crustdata
name: Crustdata
env:
- CRUSTDATA_API_KEY
setups:
  crustdata:
    class: main
    endpoint: POST https://api.crustdata.com/company/enrich
    settings:
      exact_match: true
      fields:
      - funding
      domains_per_request: 25
      seconds_between_requests: 4.1
      max_workers: 1
    pricing:
      usd: null
      unit: credit
      source: https://docs.crustdata.com/company-docs/enrichment/introduction
      note: 1 credit per company in the request, as the adapter records it. The per-credit price is not published.
