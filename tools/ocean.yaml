tool: ocean
name: Ocean.io
env:
- OCEAN_API_KEY
setups:
  ocean:
    class: main
    endpoint: POST https://api.ocean.io/v2/enrich/company
    settings:
      fields:
      - domain
      - name
      - fundingRound
      - fundingRound.date
      - fundingRound.type
      - fundingRound.moneyRaisedInUsd
      - rootUrl
      seconds_between_requests: 1.1
    pricing:
      usd: 0.064
      unit: credit
      source: https://www.ocean.io/pricing
      observed_usd_per_company: 0.0061
      note: Credits each response reported. $384 per year for 9,000 credits.
