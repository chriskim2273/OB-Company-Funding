tool: parallel
name: Parallel
env:
- PARALLEL_API_KEY
setups:
  parallel:
    class: main
    endpoint: POST https://api.parallel.ai/v1/tasks/runs
    settings:
      processor: core
      output_schema: funding
    pricing:
      usd: 0.025
      unit: task run
      source: https://docs.parallel.ai/getting-started/pricing
  parallel-responses-medium:
    class: main
    endpoint: POST https://api.parallel.ai/v1/responses
    settings:
      model: parallel
      reasoning_effort: medium
      output_schema: funding
    pricing:
      usd: 0.05
      unit: request
      source: https://docs.parallel.ai/getting-started/pricing
