tool: zoominfo
name: ZoomInfo
setups:
  zoominfo:
    class: main
    endpoint: CLI gtm companies enrich --file <domains.json> --format json
    settings:
      fields:
      - companyFunding
      - recentFundingAmount
      - recentFundingDate
      - totalFundingAmount
      domains_per_call: 10
      seconds_between_requests: 2
      max_workers: 1
    pricing:
      usd: 0.1
      unit: credit
      source: https://gtm.ai/pricing
      note: 1 data credit per new company record. $0.10 is the launch promotion for the first 5,000 credits; the standard
        rate is $0.35.
    note: Runs the gtm CLI, which uses its own sign-in, so there is no API key.
