tool: predictleads
name: PredictLeads
env:
- PREDICTLEADS_API_KEY
- PREDICTLEADS_API_TOKEN
setups:
  predictleads:
    class: main
    endpoint: GET https://predictleads.com/api/v3/companies/<domain>/financing_events
    pricing:
      usd: 0.04
      unit: request
      source: https://predictleads.com/pricing
      note: 100 free requests per month, then a $40 monthly minimum.
