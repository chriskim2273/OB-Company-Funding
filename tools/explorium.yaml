tool: explorium
name: Explorium
env:
- EXPLORIUM_API_KEY
setups:
  explorium:
    class: main
    endpoint: POST https://api.explorium.ai/v1/businesses/match, then POST https://api.explorium.ai/v1/businesses/funding_and_acquisition/bulk_enrich
    pricing:
      usd: 0.04
      unit: request
      source: https://www.explorium.ai/blog/data-for-gtm/best-b2b-data-enrichment-api-for-ai-agents/
      observed_usd_per_company: 0.0608
      note: A per-request proxy. Explorium does not publish how many credits this flow uses; it can be 1 to 5 per enrichment
        type.
