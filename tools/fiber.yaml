tool: fiber
name: Fiber
env:
- FIBER_API_KEY
setups:
  fiber:
    class: main
    endpoint: POST https://api.fiber.ai/v1/company-search
    settings:
      search_params:
        exactCompanyV2:
          identifier: domain
    pricing:
      usd: 0.02
      unit: credit
      source: https://www.fiber.ai/
      observed_usd_per_company: 0.0227
      note: Credits each response reported, successful calls only. $300 per month for 15,000 credits.
