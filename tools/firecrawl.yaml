tool: firecrawl
name: Firecrawl
env:
- FIRECRAWL_API_KEY
setups:
  firecrawl:
    class: main
    endpoint: POST https://api.firecrawl.dev/v2/agent
    settings:
      model: spark-1-mini
      max_credits: 1500
      timeout_seconds: 600
      output_schema: funding
    pricing:
      usd: 0.00059
      unit: credit
      source: https://www.firecrawl.dev/pricing
      observed_usd_per_company: 0.0995
      note: Credits vary per run; the API reports creditsUsed. $59 per month for 100,000 credits.
  firecrawl-spark-2:
    class: main
    endpoint: POST https://api.firecrawl.dev/v2/agent
    settings:
      model: spark-2
      max_credits: 1500
      timeout_seconds: 600
      output_schema: funding
    pricing:
      usd: 0.00059
      unit: credit
      source: https://www.firecrawl.dev/pricing
      observed_usd_per_company: 0.0396
      note: Observed cost is from a smaller run than the firecrawl setup.
