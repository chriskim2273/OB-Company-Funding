tool: seltz
name: Seltz
env:
- SELTZ_API_KEY
setups:
  seltz-companies:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: companies
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
    note: If the API rejects json_schema, the request is repeated with response_format json_object.
  seltz-companies-structured:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    settings:
      scope: companies
      max_results: 10
      query: <company name> <domain>
      fields:
        properties:
        - company.name
        - company.website
        - company.funding_rounds
        content: true
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
    note: Reads the company's structured record with no model.
  seltz-news:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: news
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
    note: If the API rejects json_schema, the request is repeated with response_format json_object.
  seltz-search-news:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    env:
    - SELTZ_API_KEY
    - OPENAI_API_KEY
    settings:
      scope: news
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
  seltz-search-web:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    env:
    - SELTZ_API_KEY
    - OPENAI_API_KEY
    settings:
      scope: web
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
  seltz-web:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: web
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: null
      unit: request
      source: https://seltz.ai
      note: The funding board shows no Seltz price. The enrichment board prices Seltz Answer at $0.005 per request from https://docs.seltz.ai/pricing.
