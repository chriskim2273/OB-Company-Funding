tool: fundable
name: Fundable
env:
- FUNDABLE_API_KEY
setups:
  fundable:
    class: main
    endpoint: GET https://www.tryfundable.ai/api/v1/company
    settings:
      params:
        domain: <domain>
      seconds_between_requests: 0.35
    pricing:
      usd: 0.05
      unit: returned row
      source: https://www.tryfundable.ai/api-access
      note: A domain Fundable cannot match returns no row and costs nothing.
