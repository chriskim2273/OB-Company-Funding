tool: apollo
name: Apollo
env:
- APOLLO_API_KEY
setups:
  apollo:
    class: main
    endpoint: GET https://api.apollo.io/api/v1/organizations/enrich
    settings:
      params:
        domain: <domain>
    pricing:
      usd: 0.0196
      unit: credit
      source: https://www.apollo.io/pricing?solution=enrichment
      observed_usd_per_company: 0.019
      note: '1 credit per enriched record returned. Rate modeled from the Basic plan: $49 per seat per month billed annually,
        30,000 annual credits.'
